<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Record System - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            color: #fff;
        }

        .container {
            display: flex;
            width: 100%;
        }

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            padding: 20px;
            height: 100vh;
            position: fixed;
        }

        .sidebar .logo h2 {
            color: #ff6f00;
            margin-bottom: 30px;
        }

        .nav-links {
            list-style: none;
        }

        .nav-links li {
            margin-bottom: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 16px;
        }

        .nav-links li.active a,
        .nav-links a:hover {
            color: #ff6f00;
            font-weight: bold;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
            background-image: url('image2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: calc(100% - 250px);
            position: relative;
        }

        .main-content::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(216, 202, 202, 0.5); /* Dark overlay for readability */
            z-index: 0;
        }

        .main-content > * {
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 32px;
        }

        .user-info span {
            font-weight: bold;
        }

        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: rgba(44, 62, 80, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card .number {
            font-size: 24px;
            font-weight: bold;
        }

        .recent-activity h2 {
            margin-bottom: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(201, 172, 172, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #ecf0f1;
            color: #6085aa;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #bdc3c7;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .primary-btn {
            background-color: #ff6f00;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel-btn {
            background-color: #bdc3c7;
            color: #2c3e50;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Responsive adjustments */
        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
            }

            .dashboard-cards {
                grid-template-columns: 1fr;
            }
        }
        .login-form-container {
    background-color: rgba(193, 132, 132, 0.1);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 30px;
    color: #b97012;
    max-width: 400px;
}

.login-form h2 {
    margin-bottom: 15px;
}

.login-form .form-group {
    margin-bottom: 15px;
}

.login-form label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.login-form input {
    width: 100%;
    padding: 10px;
    border-radius: 4px;
    border: none;
}
#loginModal .modal-content {
    background-color: #fff;
    color: #d6c71f;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h2>Health Records</h2>
            </div>
            <ul class="nav-links">
                <li class="active"><a href="#">Dashboard</a></li>
                <li><a href="add-patient.html">add Patient</a></li>
                <li><a href="appointments.html">appointments</a></li>
                <li><a href="prescriptions.html">prescriptions</a></li>
                <li><a href="medical-history.html">medical-history</a></li>
                <li><a href="prescriptions.html">prescriptions</a></li>
            </ul>
        </div>

        <div class="main-content">
            <header>
                <h1>Dashboard</h1>
                <div class="user-info">
                    <span>Welcome, Doctor</span>
                </div>
            </header>

            <div class="dashboard-cards">
                <div class="login-form-container">
                    <h2>Login</h2>
                    <form class="login-form">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" placeholder="Enter your username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="Enter your password" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="primary-btn">Login</button>
                        </div>
                    </form>
                </div>
                
                <div class="card">
                    <h3>Total Patients</h3>
                    <div class="number">0</div>
                </div>
                <div class="card">
                    <h3>Today's Appointments</h3>
                    <div class="number">0</div>
                </div>
                <div class="card">
                    <h3>Active Prescriptions</h3>
                    <div class="number">0</div>
                </div>
                <div class="card">
                    <h3>Recent Patients</h3>
                    <div class="number">0</div>
                </div>
            </div>

            <div class="recent-activity">
                <h2>Recent Activity</h2>
                <div class="activity-list">
                    <!-- Activity items -->
                </div>
            </div>
        </div>
    </div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <h2>Login</h2>
        <form class="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="primary-btn">Login</button>
                <button type="button" class="cancel-btn" onclick="hideModal('loginModal')">Cancel</button>
                <script>
                    function showModal(id) {
                        document.getElementById(id).style.display = 'flex';
                    }
                
                    function hideModal(id) {
                        document.getElementById(id).style.display = 'none';
                    }
                
                    function handleLogin(event) {
                        event.preventDefault();
                        const username = document.getElementById('loginUsername').value;
                        const password = document.getElementById('loginPassword').value;
                
                        if (username === 'admin' && password === 'admin123') {
                            alert('Login successful!');
                            hideModal('loginModal');
                        } else {
                            alert('Invalid credentials');
                        }
                    }
                </script>
                
            </div>
        </form>
    </div>
</div>

</body>
</html>
